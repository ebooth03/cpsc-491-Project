name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create build version
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BUILD_VERSION="0.1.${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install pytest-cov

      - name: Run core tests
        run: python -m pytest tests -q

      - name: Run API contract tests
        working-directory: backend
        run: python -m pytest tests/test_scans_api.py -v

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          python -m pytest tests -q \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.BUILD_VERSION }}
          path: backend/coverage.xml

      - name: Build summary
        if: always()
        run: |
          echo "## CI Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build version: \`$BUILD_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: \`${GITHUB_EVENT_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"

  frontend-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/styles.css

      - name: Check JavaScript syntax
        run: node --check frontend/app.js